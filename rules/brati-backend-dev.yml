version: "1.0"
rules:
  - id: "rule-github-actions"
    description: "Route workflow and push events targeting main branches to GitHub Actions topic"
    match:
      event: "push"
      refPattern: "^refs/heads/(main|master)$"
      repositories:
        - "brati-backend"
    targetTopics:
      - "webhook.events.github-actions"

  - id: "rule-jenkins-ci"
    description: "Route pull request events to Jenkins CI pipeline topic"
    match:
      event: "pull_request"
      refPattern: ".*"
      repositories:
        - "brati-backend"
    targetTopics:
      - "webhook.events.jenkins"

  - id: "rule-argo-cd"
    description: "Route deployment and tag push events for GitOps delivery to Argo CD"
    match:
      event: "create"
      refPattern: "^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
      repositories:
        - "brati-backend"
    targetTopics:
      - "webhook.events.argo"

  - id: "rule-urbancode"
    description: "Route release branches to UrbanCode Deploy topic"
    match:
      event: "push"
      refPattern: "^refs/heads/release/.*$"
      repositories:
        - "brati-backend"
    targetTopics:
      - "webhook.events.urbancode"